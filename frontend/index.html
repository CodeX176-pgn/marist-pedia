<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Marist Pedia desktop quiz application."
    >

    <title>Marist Pedia</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="app">

        <!--
            Starter screen.

            The user chooses whether this computer will operate
            as the quiz Server or as a Client.
        -->
        <section
            id="starter-screen"
            class="starter-screen"
            aria-labelledby="starter-title"
        >

            <div class="starter-card">

                <div class="starter-brand">
                    <div
                        class="starter-logo"
                        aria-hidden="true"
                    >
                        M
                    </div>

                    <h1 id="starter-title">
                        Marist Pedia
                    </h1>

                    <p>
                        Choose how you want to use Marist Pedia.
                    </p>
                </div>


                <!-- Server mode -->
                <button
                    id="server-mode-btn"
                    class="role-card"
                    type="button"
                >
                    <span
                        class="role-icon"
                        aria-hidden="true"
                    >
                        🖥
                    </span>

                    <span class="role-title">
                        Server
                    </span>

                    <span class="role-description">
                        Teacher / Host
                    </span>
                </button>


                <!-- Client mode -->
                <button
                    id="client-mode-btn"
                    class="role-card"
                    type="button"
                >
                    <span
                        class="role-icon"
                        aria-hidden="true"
                    >
                        👤
                    </span>

                    <span class="role-title">
                        Client
                    </span>

                    <span class="role-description">
                        Student / Participant
                    </span>
                </button>

            </div>

        </section>


        <!--
            Server screens will be added in later steps.
            Keeping this container now gives us a clean place
            for the Server application to take over.
        -->
        <section
            id="server-screen"
            class="application-screen hidden"
            aria-hidden="true"
        >
            <div class="screen-placeholder">

                <h1>Server Mode</h1>

                <p>
                    The Server home screen will be built next.
                </p>

                <button
                    id="server-back-btn"
                    class="button button-secondary"
                    type="button"
                >
                    Back
                </button>

            </div>
        </section>


        <!--
            Client screens will be added in later steps.
        -->
        <section
            id="client-screen"
            class="application-screen hidden"
            aria-hidden="true"
        >
            <div class="screen-placeholder">

                <h1>Client Mode</h1>

                <p>
                    The Client connection screen will be built next.
                </p>

                <button
                    id="client-back-btn"
                    class="button button-secondary"
                    type="button"
                >
                    Back
                </button>

            </div>
        </section>

    </main>


    <script
        type="module"
        src="js/app.js"
    ></script>

</body>
</html>
